<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamzami Lab — App</title>
<style>
  :root{--bg:#0d0f12;--fg:#e8e6e3;--muted:#9a958e;--accent:#c9a227;--line:#26292e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font:16px/1.7 Georgia,'Times New Roman',serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  main{max-width:640px;padding:64px 32px}
  h1{font-size:34px;font-weight:400;letter-spacing:.01em;margin-bottom:8px}
  h1 em{color:var(--accent);font-style:normal}
  .rule{width:48px;height:1px;background:var(--accent);margin:24px 0}
  p{color:var(--muted);margin-bottom:16px}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  a:hover{border-bottom-color:var(--accent)}
  footer{margin-top:40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Zamzami <em>Lab</em></h1>
  <div class="rule"></div>
  <p>Home of the Zamzami Lab tools — personal automation and productivity applications operated by Triza Zamzami.</p>
  <p>This application requests access to Google services (such as Gmail, Drive, and Calendar) solely to provide its features to its owner.</p>
  <footer><a href="privacy.html">Privacy Policy</a></footer>
</main>
</body>
</html>
